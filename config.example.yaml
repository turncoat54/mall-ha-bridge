# ============================================================
# mall-ha-bridge 配置示例
# 用法: cp config.example.yaml config.yaml, 填入你的配置后挂载到容器
# ============================================================

# ---- 商城消息 MQTT broker(消息来源, 必填)----
# 即商城系统推送订单消息的那个 MQTT 服务端
mqtt:
  host: mqtt.example.com        # MQTT 服务端 IP 或域名
  port: 1883
  username: your-username
  password: your-password
  qos: 0                    # 订阅 QoS(0/1/2)

# ---- HA 侧 MQTT broker(Discovery 实体注册, 可选)----
# 填你的 Home Assistant 所连接的 MQTT broker(如本地 mosquitto)。
# 与 mqtt 是同一个 broker 时, 本段可省略。
discovery:
  host: ha-broker.example.com
  port: 1883
  username: your-username
  password: your-password

# ---- 商城账号(必填, 可配多个)----
devices:
  - identifier: your-unique-identifier   # 登录商城后生成的独特标识
    name: 商城外卖                                 # HA 中该设备的显示名
    icon: mdi:storefront-outline
    # topic: mall/ha/{identifier}/takeout          # 订阅主题模板, {identifier} 自动替换
    # ------------------------------------------------
    # 原样保存整条 JSON 消息的传感器(可选)
    raw_sensor:
      name: 最新消息
      icon: mdi:storefront-outline
    # ------------------------------------------------
    # 富实体 / 订单摘要(可选; 不写或写 summary: 则不启用)
    # 一个实体承载整个订单: state=一句话摘要(店铺 · 状态 · 订单号),
    # attributes=整条 JSON 全部字段平铺。AI/自动化读这一个实体即拿到
    # 全部结构化数据, 无需从 N 个扁平 sensor 拼装上下文。
    # value_template 可自定义覆盖(默认模板含 event/taskStatus 码值→中文映射)。
    summary:
      name: 外卖订单
      icon: mdi:food-takeout-box
      # value_template: "{{ value_json['orderNo'] }}"
    # ------------------------------------------------
    # 逐字段定制(可选; 不写则自动生成, 字段名做展示名)
    # 字段按商城实际推送的消息为准(当前示例: 外卖订单 takeout 消息)
    # ------------------------------------------------
    # 消息字段说明(商城契约 2026-08-22 实捕示例):
    # {"event":"takeout.paid","orderId":"2090991251358797826",
    #  "orderNo":"o202608221035371","shopName":"惠满家超市","status":0,
    #  "taskStatus":1,"etaMinutes":1305,
    #  "occurredAt":"2026-08-22T10:35:40.148741074+08:00"}
    # event: takeout.paid=支付成功 | takeout.picked_up=骑手已取餐 |
    #   takeout.out_for_delivery=配送中/已发货 | takeout.near_door=快到家
    #   (进入收货围栏, 多带 distanceMeters) | takeout.deliverd=已送达
    # taskStatus: 1=待派单 | 2=骑手取货中 | 3=配送中 | 4=待收货 | 9=已取消
    # ------------------------------------------------
    fields:
      event:
        name: 事件
        icon: mdi:bell-ring-outline
        # 事件名 → 中文说明(未知事件原样显示)
        value_template: "{{ {'takeout.paid':'支付成功','takeout.picked_up':'骑手已取餐','takeout.out_for_delivery':'配送中/已发货','takeout.near_door':'快到家(进入收货围栏)','takeout.deliverd':'已送达'}.get((value_json|default({})).get('event','')|string, (value_json|default({})).get('event','')) }}"
      orderId:    { name: 订单ID,            icon: mdi:identifier }
      orderNo:    { name: 订单号,            icon: mdi:identifier }
      shopName:   { name: 店铺,              icon: mdi:store }
      status:     { name: 状态,              icon: mdi:state-machine }
      taskStatus:
        name: 任务状态
        icon: mdi:progress-clock
        # 状态码 → 中文说明(未知码原样显示)
        value_template: "{{ {'1':'待派单','2':'骑手取货中','3':'配送中','4':'待收货','9':'已取消'}.get((value_json|default({})).get('taskStatus','')|string, (value_json|default({})).get('taskStatus','')) }}"
      etaMinutes: { name: 预计送达(分钟),    icon: mdi:clock-outline, unit_of_measurement: 分钟 }
      distanceMeters:
        name: 距离(米)
        icon: mdi:map-marker-distance
        unit_of_measurement: 米
        # 仅 takeout.near_door 事件时上游会多带此字段; 平时不出现则不生成实体
      occurredAt: { name: 发生时间,          icon: mdi:clock-in }

# ---- HA 手机通知(可选, 不配置则不推送)----
# 收到订单消息时, 插件直接调 HA REST API 的 notify 服务推送手机通知,
# 内容自动美化(店铺/状态中文/订单号/预计送达, 换行排版)。
# target 留空 = 自动发现 HA 上全部手机 App(mobile_app_*)设备并群发 ——
#   新用户无需知道任何设备名, 填 ha_url + token 即可;
# 填了 = 白名单, 只推这些设备(字符串或列表均可)。
# 注: HA 的长期访问令牌在「设置 → 账户 → 安全 → 长期访问令牌」创建;
#     token 留空则通知不启用(插件其余功能正常)。
notify:
  ha_url: http://ha.example.com:8123        # Home Assistant 地址
  token: your-long-lived-access-token       # HA 长期访问令牌(敏感, 勿提交到仓库)
  target:                                   # 留空 = 自动发现全部手机 App
    # - mobile_app_sm_s9280                 # 只想推特定设备时取消注释并列出
  # enabled: true                           # 总开关(默认 true)

# ---- 字段级全局默认(可选, 对所有设备生效)----
# field_defaults:
#   status: { name: 状态 }

# ---- 行为开关 ----
auto_discover: false     # 消息出现未配置的新字段时自动创建 sensor; false=静态 schema, 新字段只进日志
republish_raw: false      # 把收到的原始消息转发到 discovery broker 的同名主题
                          # 直连远程商城 broker、且 HA 侧自动化要监听原主题时开启
availability: true        # 实体可用性跟踪: 插件离线时实体显示为不可用(默认 true)
# discovery_prefix: homeassistant    # HA discovery 前缀(默认 homeassistant)
# availability_topic: mall_ha_bridge/availability
log_level: INFO           # DEBUG / INFO / WARNING
